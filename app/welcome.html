<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <title>Empathic Art — Eyal Gever</title>
  <meta name="description" content="Feel yourself feeling. A live dialogue between you and the artwork. The artwork senses you sensing the artwork. Empathic Art — an experiential art piece by Eyal Gever." />
  <meta property="og:title" content="Empathic Art — Feel yourself feeling." />
  <meta property="og:description" content="A live dialogue between you and the artwork. The artwork senses you sensing the artwork." />
  <meta property="og:type" content="website" />

  <!--
    ═══════════════════════════════════════════════════════════════════════
    Empathic Art v2 · Landing Page
    ─────────────────────────────────────────────────────────────────────
    Author   : Eyal Gever
    License  : Proprietary — Empathic Art © 2026
    Spec     : docs/v2/LANDING-PAGE-ARCHITECTURE.md

    Design intent: Kunsthalle wall label, not startup homepage.
    One screen, black, generous negative space, no marketing UI.
    Animated Rothko canvas, title, two subtitles, Enter CTA, footer.
    ═══════════════════════════════════════════════════════════════════════
  -->

  <style>
    :root {
      --bg: #0A0A0A;
      --bg-warm: #100D0B;
      --fg: #F5F1EA;
      --fg-dim: #B8B4AC;
      --accent: #E85D24;
      /* Open-style: one grotesk family, two cuts. Space Grotesk stands in for
         Monument Grotesk (proportional). JetBrains Mono stands in for the
         Semi-Mono cut used for hero headline + micro-labels. Upgrade both to
         licensed Monument Grotesk before launch. */
      --sans: 'Space Grotesk', 'Söhne', 'Suisse', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --mono: 'JetBrains Mono', 'Monument Grotesk Semi-Mono', 'IBM Plex Mono', 'Söhne Mono', ui-monospace, monospace;
      /* --serif kept only in case anything falls through; nothing should use it. */
      --serif: var(--sans);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      scroll-behavior: smooth;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    /* ── Section base ─────────────────────────────────────────────── */
    html, body { height: 100%; }
    section {
      height: 100vh;
      padding: 8vh 8vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .rule {
      width: 32px;
      height: 2px;
      background: var(--accent);
      display: inline-block;
    }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      background: #0A0A0A;
      overflow: hidden;
    }
    /* Real Empathic Art canvas — ChapelStyle (Rothko-derived color field).
       Sits behind the type at 62% opacity so the composition breathes
       without fighting the headline. */
    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.62;
      z-index: 0;
      display: block;
    }
    /* Fallback gradient shown until the canvas mounts (or on browsers
       without WebGL2). Same warm Rothko palette so the transition is
       invisible when the canvas fades in. */
    .hero-fallback {
      position: absolute;
      inset: 0;
      opacity: 0.55;
      background:
        radial-gradient(circle at 30% 30%, rgba(180,60,30,0.35) 0%, transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(80,25,45,0.45) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(25,15,40,0.6) 0%, transparent 55%);
      z-index: 0;
      transition: opacity 1.2s ease;
    }
    .hero-fallback.faded { opacity: 0; }
    .hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 84vh;
    }
    .hero-mark {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .hero-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
      max-width: 900px;
    }
    /*
      Hero headline — Open's "A place to come to your senses." treatment.
      Proportional grotesk (Monument Grotesk Regular stand-in: Space Grotesk),
      weight 400, mixed case, VERY large, tight negative tracking (-0.03em),
      tight leading (0.92). This is the editorial-statement type Open uses
      for their big quote, not the mono clinical hero.
    */
    .hero-headline {
      font-family: var(--sans);
      font-weight: 400;
      /* Two-line register (Question). Slightly smaller than the single-line
         cut so the second line breathes on iPhone. */
      font-size: clamp(2.2rem, 6.4vw, 5.2rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    /* Subtitles — proportional sans, mixed case, body-copy scale. */
    .hero-subhead {
      font-family: var(--sans);
      font-weight: 400;
      font-size: clamp(1rem, 1.35vw, 1.25rem);
      line-height: 1.4;
      color: var(--fg-dim);
      max-width: 640px;
      letter-spacing: 0.005em;
      display: flex;
      flex-direction: column;
      gap: 0.7em;
    }
    .hero-subhead-echo {
      color: var(--fg);
      font-style: normal;
      opacity: 0.92;
    }
    /* Bottom hero row — uppercase mono, no added tracking. */
    .hero-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .hero-footer a { color: var(--fg); border-bottom: 1px solid var(--accent); padding-bottom: 2px; }

    /* ── Footer ───────────────────────────────────────── */
    footer {
      background: var(--bg);
      padding: 4vh 8vw 6vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg-dim);
      border-top: 1px solid rgba(245,241,234,0.08);
    }
    footer .links a { margin-left: 24px; }
    footer .links a:first-child { margin-left: 0; }

    /* ── Responsive ───────────────────────────────────────────────── */
    @media (max-width: 780px) {
      section { padding: 6vh 6vw; }
      .hero-footer { flex-direction: column; align-items: flex-start; gap: 16px; }
      footer { flex-direction: column; align-items: flex-start; gap: 12px; }
      footer .links a { margin-left: 0; margin-right: 20px; }
    }

    /* Accessibility · reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .hero-fluid { animation: none; }
      body { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <!-- ═══ SECTION 1 · HERO ══════════════════════════════════════════ -->
  <section class="hero">
    <canvas class="hero-canvas" id="hero-canvas" aria-hidden="true"></canvas>
    <div class="hero-fallback" id="hero-fallback" aria-hidden="true"></div>
    <div class="hero-content">
      <div class="hero-mark">
        <span class="rule"></span>
        <span>EMPATHIC&nbsp;ART</span>
      </div>

      <div class="hero-center">
        <h1 class="hero-headline">In the age of thinking machines,<br />what does it mean to be human?</h1>
        <div class="hero-subhead">
          <span>Empathic Art. An artwork that senses you, and feels you feeling it.</span>
          <span class="hero-subhead-echo">Feel yourself feeling.</span>
        </div>
      </div>

      <div class="hero-footer">
        <a href="/index.html">Enter the work <span style="color:var(--accent)">→</span></a>
        <span>Eyal&nbsp;Gever&nbsp;·&nbsp;2026</span>
      </div>
    </div>
  </section>

  <!--
    Hero visual · ChapelStyle · Rothko-derived color field.
    Driven by a slow, incommensurate 3-axis emotional drift so the frame
    breathes without ever appearing to loop. Ambient-only — no user input.
    Runs at reduced opacity behind the type. Respects prefers-reduced-motion.
  -->
  <script type="module">
    import { ChapelStyle } from "./src/visuals/chapel-style.js?v=1.3.1";

    const canvas = document.getElementById("hero-canvas");
    const fallback = document.getElementById("hero-fallback");

    // Respect reduced-motion — leave the gradient fallback in place.
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      canvas.style.display = "none";
    } else {
      try {
        // ChapelStyle checks its own WebGL2 support; if it throws, we fall
        // through to the gradient fallback.
        const style = new ChapelStyle(canvas);

        // Ambient emotional drift — three incommensurate sine cycles so
        // the visual never returns to the same state within a visit.
        //   valence  drifts through [-0.35, +0.55]  · period 187s
        //   arousal  drifts through [-0.15, +0.35]  · period 143s
        //   openness drifts through [ 0.35, 0.75]  · period 211s
        // The bounds keep the palette inside Rothko's late-period range —
        // moody, warm, saturated, never anxious or celebratory.
        const startT = performance.now();
        const drift = (now) => {
          const t = (now - startT) / 1000; // seconds
          const v = 0.10 + 0.45 * Math.sin((2 * Math.PI * t) / 187);
          const a = 0.10 + 0.25 * Math.sin((2 * Math.PI * t) / 143 + 1.7);
          const o = 0.55 + 0.20 * Math.sin((2 * Math.PI * t) / 211 + 3.1);
          try { style.setEmotion(v, a, o); } catch { /* style not ready yet */ }
          driftRAF = requestAnimationFrame(drift);
        };
        let driftRAF = requestAnimationFrame(drift);

        style.start();

        // Fade the gradient fallback out once the canvas has a frame or two.
        setTimeout(() => fallback.classList.add("faded"), 400);

        // Re-fit on resize.
        const ro = new ResizeObserver(() => { try { style.resize(); } catch {} });
        ro.observe(canvas);

        // Pause when the tab is hidden (browsers throttle anyway, but this
        // stops the drift walker cleanly).
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            cancelAnimationFrame(driftRAF);
            try { style.stop(); } catch {}
          } else {
            try { style.start(); } catch {}
            driftRAF = requestAnimationFrame(drift);
          }
        });
      } catch (err) {
        // Any failure (WebGL2 unsupported, module load error, etc.) leaves
        // the gradient fallback in place. No user-facing error.
        console.warn("[hero] ChapelStyle unavailable, using gradient fallback:", err);
        canvas.style.display = "none";
      }
    }
  </script>

  <!-- ═══ FOOTER ═══════════════════════════════════════════════════ -->
  <footer>
    <div>Empathic Art · Eyal Gever · 2026</div>
    <div class="links">
      <a href="/about.html">About</a>
      <a href="mailto:eyalgever@gmail.com">Contact</a>
    </div>
  </footer>

</body>
</html>
